        <title>OpenSync</title>

<script type="module" async data-arcane-pwa src="/arcane-pwa.mjs"></script>

    <body>
        <header class="app-header">
            <h1>OpenSync Synchronizer</h1>
            <div class="header-actions">
                <button type="button" id="connect-device" class="arcane-button">
                    Connect
                </button>
                <button type="button" id="send-settings" class="arcane-button">
                    Send
                </button>
                <button type="button" id="run-stop" class="arcane-button">
                    Run/Stop
                </button>
            </div>
        </header>
        <section aria-labelledby="system-heading">
            <div class="section-header">
                <h2 id="system-heading">System</h2>
                <div class="header-actions">
                    <button type="button" id="reset-all" class="arcane-button">
                        Reset all
                    </button>
                    <button type="button" id="reset-system" class="arcane-button">
                        Reset system
                    </button>
                </div>
            </div>

            <!-- Outer grid: two columns, one row -->
            <div class="system-layout">

                <fieldset>
                    <legend>Internal rate timer</legend>

                    <!-- Timer grid: three columns, two rows -->
                    <div class="system-timer-grid">

                        <!-- Row 1: enable, divider, on counts -->
                        <div class="arcane-field">
                            <label for="system-enable">Enable</label>
                            <input
                                type="checkbox"
                                id="system-enable"
                                name="enable"
                            >
                        </div>

                        <div class="arcane-field">
                            <label for="system-divider">Divider</label>
                            <input
                                type="number"
                                id="system-divider"
                                name="divider"
                                min="1"
                                max="65500"
                                step="1"
                                value="1"
                            >
                        </div>

                        <div class="arcane-field">
                            <label for="system-on-counts">On counter</label>
                            <input
                                type="number"
                                id="system-on-counts"
                                name="onCounts"
                                min="1"
                                max="1000000000"
                                step="1"
                                value="1"
                            >
                        </div>

                        <!-- Row 2: period, burst counts, off counts -->
                        <div class="arcane-field">
                            <label for="system-period">Period</label>
                            <div class="period-controls">
                                <input
                                    type="number"
                                    id="system-period"
                                    name="period"
                                    step="any"
                                    min="0"
                                    value="0.1"
                                >
                                <select id="system-period-unit" name="periodUnit"
                                        aria-label="Period units">
                                    <option value="ns">ns</option>
                                    <option value="us">us</option>
                                    <option value="ms">ms</option>
                                    <option value="s" selected>s</option>
                                </select>
                            </div>
                        </div>

                        <div class="arcane-field">
                            <label for="system-burst-counts">Burst counter</label>
                            <input
                                type="number"
                                id="system-burst-counts"
                                name="burstCounts"
                                min="0"
                                max="30000000"
                                step="1"
                                value="0"
                            >
                        </div>

                        <div class="arcane-field">
                            <label for="system-off-counts">Off counter</label>
                            <input
                                type="number"
                                id="system-off-counts"
                                name="offCounts"
                                min="0"
                                max="1000000000"
                                step="1"
                                value="0"
                            >
                        </div>

                    </div>
                </fieldset>

                <fieldset>
                    <legend>Trigger / gate</legend>

                    <!-- Trigger grid: two columns, two rows -->
                    <div class="system-trigger-grid">

                        <!-- Row 1 -->
                        <div class="arcane-field">
                            <label for="system-trigger-mode">Trigger mode</label>
                            <select id="system-trigger-mode" name="triggerMode">
                                <option value="disabled">Disabled</option>
                                <option value="triggered">Triggered</option>
                            </select>
                        </div>

                        <div class="arcane-field">
                            <label for="system-gate-mode">Gate mode</label>
                            <select id="system-gate-mode" name="gateMode">
                                <option value="disabled">Disabled</option>
                                <option value="pulse">Pulse</option>
                                <option value="output">Output</option>
                                <option value="channel">Channel</option>
                            </select>
                        </div>                     

                        <!-- Row 2 -->
                         <div class="arcane-field">
                            <label for="system-trigger-edge">Trigger edge</label>
                            <select id="system-trigger-edge" name="triggerEdge">
                                <option value="rising">Rising</option>
                                <option value="falling">Falling</option>
                            </select>
                        </div>

                        <div class="arcane-field">
                            <label for="system-gate-logic">Gate logic</label>
                            <select id="system-gate-logic" name="gateLogic">
                                <option value="high">High</option>
                                <option value="low">Low</option>
                            </select>
                        </div>

                    </div>
                </fieldset>

            </div>
        </section>

        <section id="channels" aria-labelledby="channels-heading">
            <div class="section-header channels-header">
                <h2 id="channels-heading">Channels</h2>

                <ul class="channel-list" aria-label="Select channel">

                    <li>

                    <li>
                        <button type="button" class="arcane-button channel-button"

                        </button>
                    </li>
                    <li>
                        <button type="button" class="arcane-button channel-button"
                                data-channel="G" aria-pressed="false">
                            CH G
                        </button>
                    </li>
                    <li>
                        <button type="button" class="arcane-button channel-button"
                                data-channel="H" aria-pressed="false">
                            CH H
                        </button>
                    </li>
                </ul>
                <button type="button" id="reset-channel" class="arcane-button">
                    Reset channel
                </button>
            </div>

            <fieldset id="channel-editor" data-channel="A">
                <legend id="channel-editor-heading">CH A settings</legend>

                <div class="channel-options">
                    <div class="arcane-field channel-enable">
                        <label for="channel-enable">Enable</label>
                        <input type="checkbox" id="channel-enable" name="enable">
                    </div>

                    <div class="channel-mode">
                        <label class="arcane-field">
                            <span class="arcane-field__label">Mode</span>
                            <select name="mode">
                                <option value="lvttl" selected>LVTTL</option>
                                <option value="ttl">TTL</option>
                            </select>
                        </label>
                    </div>
                </div>

                <!-- Four columns, two rows -->
                <div class="channel-controls">

                    <!-- Row 1 -->
                    <label class="arcane-field">
                        <span class="arcane-field__label">Divider</span>
                        <input type="number" name="divider"
                            min="1"
                            max="65500"
                            step="1"
                            value="1"
                        >
                    </label>

                    <label class="arcane-field">
                        <span class="arcane-field__label">Wait counter</span>
                        <input type="number" name="waitCount"
                            min="0" 
                            max="1000000000"
                            step="1" 
                            value="0"
                        >
                    </label>

                    <label class="arcane-field">
                        <span class="arcane-field__label">On counter</span>
                        <input type="number" name="onCount"
                            min="1"
                            max="1000000000"
                            step="1" 
                            value="1"
                        >
                    </label>

                    <label class="arcane-field">
                        <span class="arcane-field__label">Gate mode</span>
                        <select name="gateMode">

                            <option value="pulse">Pulse</option>
                            <option value="output">Output</option>
                        </select>
                    </label>

                    <!-- Row 2 -->
                    <label class="arcane-field">
                        <span class="arcane-field__label">Sync</span>
                        <select name="sync">
                            <option value="T0">T0</option>
                            <option value="A">CH A</option>
                            <option value="B">CH B</option>
                            <option value="C">CH C</option>
                            <option value="D">CH D</option>
                            <option value="E">CH E</option>
                            <option value="F">CH F</option>
                            <option value="G">CH G</option>
                            <option value="H">CH H</option>
                        </select>
                    </label>
